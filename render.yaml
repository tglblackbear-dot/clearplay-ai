services:
  - type: web
    name: clearplay-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clearplay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clearplay-cache
          property: connectionString
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

  - type: keyvalue
    name: clearplay-cache
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: permitir web service
    maxmemoryPolicy: allkeys-lru

databases:
  - name: clearplay-db
    plan: free
    databaseName: clearplay
    ipAllowList:
      - source: 0.0.0.0/0
        description: permitir web service
