<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ClearPlay AI</title>
<style>
body{width:280px;margin:0;font-family:Inter,system-ui,sans-serif;background:#0B1020;color:#F5F7FC;padding:18px}
h1{font-size:16px;margin:0 0 4px}.sub{color:#A6B1C5;font-size:11px;margin:0 0 16px}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0;font-size:12px}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:#151D30;color:#A6B1C5}
button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:9px;background:#527BFF;color:#fff;font-weight:600;cursor:pointer}
</style></head><body>
<h1>ClearPlay AI</h1>
<p class="sub">Assista ao que você ama. Do seu jeito.</p>
<div class="row"><span>Filtragem</span><span class="badge" id="filter">—</span></div>
<div class="row"><span>Player detectado</span><span class="badge" id="player">—</span></div>
<div class="row"><span>Tempo</span><span class="badge" id="time">—</span></div>
<button id="toggle">Alterar filtragem</button>
<script type="module" src="popup.js"></script>
</body></html>
