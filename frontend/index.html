<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      const redirectPath = sessionStorage.getItem("clearplay-redirect");
      if (redirectPath) {
        sessionStorage.removeItem("clearplay-redirect");
        history.replaceState(null, "", redirectPath.replace(/^\/clearplay-ai/, ""));
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1020" />
    <title>ClearPlay AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
